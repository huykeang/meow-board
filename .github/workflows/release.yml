name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package meowboard.tar.gz
        run: git archive --prefix=meowboard/ --format=tar.gz --output=meowboard.tar.gz HEAD

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/meowboard-release"
          kind="$(git for-each-ref refs/meowboard-release --format='%(objecttype)')"
          notes=""
          if [[ "${kind}" == "tag" ]]; then
            subject="$(git for-each-ref refs/meowboard-release --format='%(contents:subject)')"
            body="$(git for-each-ref refs/meowboard-release --format='%(contents:body)')"
            if [[ "${subject}" == "${GITHUB_REF_NAME}" ]]; then
              notes="${body}"
            elif [[ -n "${body//[[:space:]]/}" ]]; then
              notes="${subject}"$'\n\n'"${body}"
            else
              notes="${subject}"
            fi
          fi
          if [[ -n "${notes//[[:space:]]/}" ]]; then
            gh release create "${GITHUB_REF_NAME}" meowboard.tar.gz \
              --title "${GITHUB_REF_NAME}" \
              --notes "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" meowboard.tar.gz \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
