name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package meowboard.tar.gz
        run: git archive --prefix=meowboard/ --format=tar.gz --output=meowboard.tar.gz HEAD

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/meowboard-release"
          kind="$(git for-each-ref refs/meowboard-release --format='%(objecttype)')"
          title=""
          notes=""
          if [[ "${kind}" == "tag" ]]; then
            title="$(git for-each-ref refs/meowboard-release --format='%(contents:subject)')"
            notes="$(git for-each-ref refs/meowboard-release --format='%(contents:body)')"
          fi
          if [[ -z "${title}" ]]; then
            title="${GITHUB_REF_NAME}"
          fi
          if [[ -n "${notes//[[:space:]]/}" ]]; then
            gh release create "${GITHUB_REF_NAME}" meowboard.tar.gz \
              --title "${title}" \
              --notes "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" meowboard.tar.gz \
              --title "${title}" \
              --generate-notes
          fi
