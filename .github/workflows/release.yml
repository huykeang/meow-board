name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package meowboard.tar.gz
        run: git archive --prefix=meowboard/ --format=tar.gz --output=meowboard.tar.gz HEAD

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" meowboard.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
